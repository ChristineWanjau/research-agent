[project]
name = "research-agent"
version = "0.1.0"
description = "A LangGraph research agent that writes cited tech-comparison reports."
requires-python = ">=3.13"
dependencies = [
    "langgraph>=0.4",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-core>=0.3",
    "langchain-groq>=0.3",
    "langchain-google-genai>=2.1",
    "langchain-ollama>=0.3",
    "tavily-python>=0.7",
    "ddgs>=9.0",
    "pydantic-settings>=2.6",
    "python-slugify>=8.0",
    "streamlit>=1.40",
]

[project.scripts]
research-agent = "research_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "langgraph-cli[inmem]>=0.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real Groq/Tavily APIs (run with `pytest -m live`)"]
addopts = "-m 'not live'"
